<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 142" width="264" height="142"
     role="img" aria-label="Try the bot @MarkdownRenderBot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Try the bot @MarkdownRenderBot</title>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2=".6" y2="1">
